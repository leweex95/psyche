[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psyche-support"
version = "0.1.0"
description = "Local-first CLI psychological support companion"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12,<1", "rich>=13,<15", "pydantic>=2.7,<3", "PyYAML>=6,<7",
  "python-dotenv>=1,<2", "sqlcipher3-wheels>=0.5.4; platform_system == 'Windows'",
  "pywin32>=306; platform_system == 'Windows'",
  "openai>=1.30,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9", "pytest-asyncio>=0.23,<2", "httpx>=0.27,<1",
  "audioop-lts>=0.2.1; python_version >= '3.13'",
]
voice = [
  "sounddevice>=0.5,<1", "webrtcvad-wheels>=2.0.14,<3", "websockets>=14,<16",
  "audioop-lts>=0.2.1; python_version >= '3.13'",
]

[project.scripts]
psyche = "psyche.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

app:
  name: psyche
  log_level: WARNING
llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.5
  max_output_tokens: 300
  request_timeout_seconds: 30
conversation:
  default_methodology: auto
  target_response_words: 35
retrieval:
  max_memories: 12
  weights:
    relevance: 0.40
    importance: 0.25
    evidence: 0.15
    recency: 0.10
    context: 0.10
context:
  safety_instructions_tokens: 1000
  methodology_tokens: 700
  profile_tokens: 1500
  retrieved_memories_tokens: 1500
  recent_conversation_tokens: 3000
  max_recent_messages: 20
privacy:
  cloud_processing_allowed: true
safety:
  enabled: true
voice:
  input_device: null
  output_device: null
  sample_rate: 16000
  frame_ms: 30
  stt_model: gpt-live-transcribe
  tts_model: gpt-4o-mini-tts
  tts_voice: alloy
  vad:
    enabled: true
    aggressiveness: 2
    end_silence_ms: 550
    pre_roll_ms: 240
